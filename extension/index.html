<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twoncut</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icon set -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4M7 6v12M11 9v6M15 4v16M19 8v8"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L7.5 3.64A1 1 0 0 0 6 4.5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4M4 4h12l-2 4 2 4H4"/></symbol>
    <symbol id="i-flag-cut" viewBox="0 0 24 24"><path d="M4 22V4M4 4h10l-2 4 2 4H4"/><circle cx="18" cy="15" r="2"/><circle cx="18" cy="21" r="2"/><path d="M22 13l-5.5 6.5M22 23l-2.6-3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 17.5l10 5 10-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  </svg>

  <div class="app">
    <header class="top">
      <div class="brand">twonedit</div>
      <button class="icon-btn" id="toggleAdvanced" data-i18n-title="gearTitle"><svg><use href="#i-gear"/></svg></button>
    </header>

    <main class="scroll">
      <div id="status" class="toast hidden" role="status"></div>

      <!-- Advanced -->
      <section class="panel advanced hidden" id="advanced">
        <div class="label" data-i18n="advanced"></div>
        <div class="input-label" data-i18n="language"></div>
        <div class="lang-switch" id="langSwitch"></div>
        <label class="input-label" for="ffmpegPath" data-i18n="ffmpegPath"></label>
        <input type="text" id="ffmpegPath" data-i18n-placeholder="ffmpegPlaceholder" spellcheck="false">
        <button id="clearMarkers" class="text-btn"><svg><use href="#i-trash"/></svg><span data-i18n="clearMarkers"></span></button>
        <div class="input-label" data-i18n="log"></div>
        <div class="log" id="log" data-i18n-empty="logEmpty"></div>
      </section>

      <!-- Selection -->
      <section class="panel">
        <div class="label" data-i18n="selection"></div>
        <div class="sel-sub" id="selInfo"></div>
        <button id="analyze" class="btn-analyze">
          <span class="fill" id="progressFill"></span>
          <svg class="ic" id="analyzeIcon"><use href="#i-play"/></svg>
          <span class="label-text" id="analyzeLabel"></span>
        </button>
      </section>

      <!-- Preview -->
      <section class="panel">
        <div class="row-between">
          <div class="label" data-i18n="preview"></div>
          <div class="legend"><span class="dot keep"></span><span data-i18n="keep"></span><span class="dot cut"></span><span data-i18n="cutLegend"></span></div>
        </div>
        <div class="wave-wrap">
          <canvas id="wave"></canvas>
          <div class="wave-empty" id="waveEmpty" data-i18n="waveEmpty"></div>
          <div class="wave-tip hidden" id="waveTip"></div>
        </div>
        <div class="wave-time"><span id="tStart">0:00</span><span id="tEnd"></span></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-v good" id="sSaved">–</div>
            <div class="stat-k" data-i18n="saved"></div>
          </div>
          <div class="stat">
            <div class="stat-v"><span id="sAfter">–</span></div>
            <div class="stat-k"><span data-i18n="newLength"></span> <span class="muted-inline" id="sBefore"></span></div>
          </div>
          <div class="stat">
            <div class="stat-v" id="sCuts">–</div>
            <div class="stat-k" data-i18n="cuts"></div>
          </div>
        </div>
      </section>

      <!-- Settings -->
      <section class="panel">
        <div class="label" data-i18n="settings"></div>
        <div class="field first">
          <div class="field-head">
            <label for="threshold" data-i18n="threshold"></label>
            <button class="chip-btn" id="autoThr" data-i18n-title="autoTitle"><svg><use href="#i-sparkles"/></svg><span data-i18n="auto"></span></button>
            <span class="val" id="thresholdVal"></span>
          </div>
          <input type="range" id="threshold" min="-60" max="-15" step="1" value="-35">
        </div>

        <div class="field">
          <div class="field-head">
            <label for="minSilence" data-i18n="minSilence"></label>
            <span class="val" id="minSilenceVal"></span>
          </div>
          <input type="range" id="minSilence" min="0.1" max="3" step="0.05" value="0.5">
        </div>

        <div class="field">
          <div class="field-head">
            <label for="padding" data-i18n="padding"></label>
            <span class="val" id="paddingVal"></span>
          </div>
          <input type="range" id="padding" min="0" max="0.5" step="0.01" value="0.12">
        </div>

        <label class="switch-row">
          <span><span data-i18n="backup"></span> <span class="hint" data-i18n="backupHint"></span></span>
          <span class="switch"><input type="checkbox" id="backup" checked><span class="knob"></span></span>
        </label>
      </section>

      <div class="marker-row">
        <button id="addMarkers" class="text-btn" disabled data-i18n-title="addMarkersTitle"><svg><use href="#i-flag"/></svg><span data-i18n="addMarkers"></span></button>
        <span class="sep"></span>
        <button id="cutMarkers" class="text-btn" disabled data-i18n-title="cutMarkersTitle"><svg><use href="#i-flag-cut"/></svg><span data-i18n="cutMarkers"></span></button>
      </div>
    </main>

    <footer class="actions">
      <button id="undo" class="btn-undo" disabled><svg><use href="#i-undo"/></svg></button>
      <button id="cut" class="btn-cut" disabled>
        <svg><use href="#i-scissors"/></svg>
        <span id="cutLabel"></span>
      </button>
    </footer>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
